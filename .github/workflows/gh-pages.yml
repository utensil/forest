name: Deploy My forest to Pages

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "README.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - "LICENSE"
      - "README.md"
    branches:
      - main

# Allow one concurrent deployment
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record source tree
        id: source
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Find validated PR artifact
        if: ${{ github.event_name == 'push' }}
        id: reuse
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        with:
          script: |
            const artifactName = `pages-${process.env.SOURCE_TREE}`;
            const {data} = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
              per_page: 100,
            });

            for (const artifact of data.artifacts) {
              if (artifact.expired || artifact.name !== artifactName || !artifact.workflow_run) {
                continue;
              }
              if (artifact.workflow_run.head_repository_id !== context.payload.repository.id) {
                continue;
              }

              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: artifact.workflow_run.id,
              });
              if (run.name !== context.workflow || run.event !== 'pull_request' ||
                  run.status !== 'completed' || run.conclusion !== 'success') {
                continue;
              }

              core.info(`Reusing ${artifactName} from successful PR run ${run.id}`);
              core.setOutput('found', 'true');
              core.setOutput('artifact-id', String(artifact.id));
              core.setOutput('run-id', String(run.id));
              return;
            }

            core.info(`No successful PR artifact records source tree ${process.env.SOURCE_TREE}`);
            core.setOutput('found', 'false');
      - name: Download validated PR artifact
        if: ${{ github.event_name == 'push' && steps.reuse.outputs.found == 'true' }}
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.reuse.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.reuse.outputs.run-id }}
          path: ${{ runner.temp }}/validated-pages
      - name: Restore validated PR artifact
        if: ${{ github.event_name == 'push' && steps.download.outcome == 'success' }}
        id: restore
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/restored-pages"
          tar -xf "$RUNNER_TEMP/validated-pages/artifact.tar" -C "$RUNNER_TEMP/restored-pages"
          test -s "$RUNNER_TEMP/restored-pages/index.html"
          mkdir -p output
          mv "$RUNNER_TEMP/restored-pages" output/forest
      - uses: extractions/setup-just@v1
        if: ${{ steps.restore.outcome != 'success' }}
        with:
          just-version: 1.40.0
      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.restore.outcome != 'success' }}
        with:
          bun-version: 1.2.22
      # The lint step runs the stdlib-only FTIP prose checker through uv.
      - name: Setup Python via uv
        if: ${{ steps.restore.outcome != 'success' }}
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.27"
      - name: Setup Biome
        if: ${{ steps.restore.outcome != 'success' }}
        uses: biomejs/setup-biome@v2
        with:
            version: latest
      - name: Lint
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          ./chk.sh
      - name: Setup TeX Live
        if: ${{ steps.restore.outcome != 'success' }}
        uses: utensil/setup-texlive-action@v4
        with:
          packages: scheme-full
          # Pin to 2025: TeX Live 2026 (released 2026-05) breaks the action for a
          # few days post-release ("may not work properly"). Bump/remove once 2026 settles.
          version: 2025
      - name: Check `latex`
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          echo $GITHUB_PATH
          tlmgr --version
          which latex
      - name: Cache WASM packages
        if: ${{ steps.restore.outcome != 'success' }}
        uses: actions/cache@v4
        with:
          path: |
            lib/**/pkg
          key: ${{ runner.os }}-wasm-${{ hashFiles('build.sh', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Setup Pages
        if: ${{ !env.ACT }}
        id: pages
        uses: actions/configure-pages@v5
      - name: Set-up OCaml
        if: ${{ steps.restore.outcome != 'success' }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"
          # dune-cache: true
      # - name: Cache opam packages
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.opam
      #     key: ${{ runner.os }}-opam-${{ hashFiles('**/*.opam') }}
      #     restore-keys: |
      #       ${{ runner.os }}-opam-
      - name: Install forester
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          sudo apt install libev-dev
          sudo apt update
          sudo apt install libev-dev
          opam pin add lsp 1.22.0 --yes
          opam pin add jsonrpc 1.22.0 --yes
          opam pin add forester git+https://github.com/utensil/ocaml-forester.git#2ed9c1cab0112921eb3497cb1a5a0e2fbaa1f8cd --yes
          opam install forester --yes
      - name: Install xsltproc and PDF text tools
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          sudo apt install xsltproc poppler-utils
      # - name: Install Homebrew
      #   run: |
      #     bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      #     eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
      #     echo "$(brew --prefix)/bin" >> $GITHUB_PATH
      # - name: Install saxon
      #   run: |
      #     brew install saxon
      - name: Build with forester
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          eval $(opam env)
          export TERM=xterm-256color
          forester --version
          bash ./build.sh
      # A restored pull-request artifact has HTML and no fixture PDFs.
      # Install only what lize.sh and the PDF date check need, then overlay
      # the fourteen PDFs before the Pages upload.
      - name: Setup just for the main PDF overlay
        if: ${{ github.event_name == 'push' && steps.restore.outcome == 'success' }}
        uses: extractions/setup-just@v1
        with:
          just-version: 1.40.0
      - name: Setup bun for the main PDF overlay
        if: ${{ github.event_name == 'push' && steps.restore.outcome == 'success' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install xslt3 for the main PDF overlay
        if: ${{ github.event_name == 'push' && steps.restore.outcome == 'success' }}
        run: bun install --frozen-lockfile
      - name: Setup Python for the main PDF overlay
        if: ${{ github.event_name == 'push' && steps.restore.outcome == 'success' }}
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.27"
      - name: Setup TeX Live for the main PDF overlay
        if: ${{ github.event_name == 'push' && steps.restore.outcome == 'success' }}
        uses: utensil/setup-texlive-action@v4
        with:
          packages: scheme-full
          version: 2025
      - name: Install poppler for the main PDF overlay
        if: ${{ github.event_name == 'push' && steps.restore.outcome == 'success' }}
        run: |
          sudo apt install poppler-utils
          which lualatex pdftotext bun
      - name: Verify Forester output contract
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          just verify-render
      - name: Verify PDF fixtures on main
        if: ${{ github.event_name == 'push' }}
        run: |
          just verify-pdf-fixtures
      # - name: Check for PDF files
      #   run: |
      #     pdf_count=$(find ./output -name "*.pdf" | wc -l)
      #     if [ "$pdf_count" -eq 0 ]; then
      #       echo "Error: No PDF files found in the output directory."
      #       exit 1
      #     fi
      #     echo "Found $pdf_count PDF files."
      - name: Fix permissions
        run: |
          chmod -c -R +rX "./output/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done
      - name: Upload validated PR artifact
        if: ${{ !env.ACT && github.event_name == 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ steps.source.outputs.tree }}
          path: ./output/forest
      - name: Upload Pages artifact
        if: ${{ !env.ACT && github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output/forest

  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    # The poll below waits 45 minutes, then cancels. Leave headroom so
    # the runner is not killed before that cancel runs.
    timeout-minutes: 60
    if: ${{ github.event_name == 'push' }}
    steps:
      # actions/deploy-pages@v4 clamps its timeout to 600000 ms and then
      # cancels the deployment. A slow syncing_files state never finishes.
      # This step creates the same deployment and polls without that cancel.
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          sha = os.environ["GITHUB_SHA"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          deadline_s = 45 * 60
          final_ok = {"succeed", "success"}
          final_err = {
              "deployment_failed",
              "deployment_perms_error",
              "deployment_content_failed",
              "deployment_cancelled",
              "deployment_lost",
          }

          def redact(obj):
              if isinstance(obj, dict):
                  return {k: ("***" if k == "oidc_token" else redact(v)) for k, v in obj.items()}
              if isinstance(obj, list):
                  return [redact(v) for v in obj]
              return obj

          def request(method, url, body=None, auth=None, github=True):
              data = None if body is None else json.dumps(body).encode()
              headers = {}
              if github:
                  headers["Accept"] = "application/vnd.github+json"
                  headers["X-GitHub-Api-Version"] = "2022-11-28"
              else:
                  headers["Accept"] = "application/json"
              if auth:
                  headers["Authorization"] = auth
              if body is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as err:
                  raw = err.read().decode()
                  try:
                      parsed = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      parsed = {"message": raw[:500]}
                  return err.code, parsed

          oidc_code, oidc_payload = request(
              "GET",
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"],
              auth="bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
              github=False,
          )
          if oidc_code != 200 or not isinstance(oidc_payload, dict) or "value" not in oidc_payload:
              message = oidc_payload.get("message") if isinstance(oidc_payload, dict) else ""
              print(f"OIDC token request failed: HTTP {oidc_code} {message}", file=sys.stderr)
              sys.exit(1)
          oidc = oidc_payload["value"]
          print("::add-mask::" + oidc)

          artifact_id = None
          artifact_size = None
          for _attempt in range(24):
              code, payload = request(
                  "GET",
                  f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100",
                  auth="Bearer " + token,
              )
              if code == 200 and isinstance(payload, dict):
                  matches = [
                      item
                      for item in payload.get("artifacts", [])
                      if item.get("name") == "github-pages" and not item.get("expired")
                  ]
                  if len(matches) == 1:
                      artifact_id = int(matches[0]["id"])
                      artifact_size = matches[0].get("size_in_bytes")
                      break
                  print(f"github-pages artifact count is {len(matches)}; retrying")
              else:
                  print(f"artifact list HTTP {code}; retrying")
              time.sleep(5)
          if artifact_id is None:
              print(f"No single github-pages artifact on run {run_id}", file=sys.stderr)
              sys.exit(1)
          print(f"Using artifact {artifact_id} size {artifact_size}")

          code, deployment = request(
              "POST",
              f"{api}/repos/{repo}/pages/deployments",
              body={
                  "artifact_id": artifact_id,
                  "pages_build_version": sha,
                  "oidc_token": oidc,
              },
              auth="Bearer " + token,
          )
          if code not in (200, 201) or not isinstance(deployment, dict):
              print(
                  f"Create deployment failed: HTTP {code} {json.dumps(redact(deployment))[:1000]}",
                  file=sys.stderr,
              )
              sys.exit(1)

          status_url = str(deployment.get("status_url") or "")
          dep_id = deployment.get("id") or (status_url.rstrip("/").split("/")[-1] if status_url else "") or sha
          page_url = deployment.get("page_url") or ""
          if status_url.startswith(api + "/"):
              poll_url = status_url
          else:
              poll_url = f"{api}/repos/{repo}/pages/deployments/{dep_id}"
          safe = {k: deployment.get(k) for k in ("id", "status_url", "page_url") if k in deployment}
          print("Created deployment " + json.dumps(safe))
          print("Polling " + poll_url)
          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path and page_url:
              with open(output_path, "a", encoding="utf-8") as handle:
                  handle.write(f"page_url={page_url}\n")

          started = time.time()
          deadline = started + deadline_s
          last = None
          next_beat = started
          while True:
              now = time.time()
              code, payload = request(
                  "GET",
                  poll_url,
                  auth="Bearer " + token,
              )
              if code == 200 and isinstance(payload, dict):
                  state = payload.get("status") or "unknown_status"
                  if state != last or now >= next_beat:
                      elapsed = int((now - started) / 60)
                      detail = ""
                      if state == "unknown_status":
                          detail = " keys=" + ",".join(sorted(str(k) for k in payload))
                          extra = payload.get("error") or payload.get("message") or ""
                          if extra:
                              detail += " detail=" + str(extra)[:180]
                      print(f"Current status: {state} ({elapsed} min){detail}")
                      last = state
                      next_beat = now + 60
                  if state in final_ok:
                      if output_path:
                          with open(output_path, "a", encoding="utf-8") as handle:
                              handle.write("status=succeed\n")
                      print("Reported success")
                      sys.exit(0)
                  if state in final_err:
                      print(f"Deployment ended with {state}", file=sys.stderr)
                      sys.exit(1)
              elif now >= next_beat:
                  print(f"Status query HTTP {code} ({int((now - started) / 60)} min)")
                  next_beat = now + 60
              if time.time() >= deadline:
                  break
              time.sleep(15)

          print("Still not succeed after 45 minutes; cancelling", file=sys.stderr)
          code, payload = request(
              "POST",
              f"{api}/repos/{repo}/pages/deployments/{dep_id}/cancel",
              auth="Bearer " + token,
          )
          print(f"Cancel HTTP {code} {json.dumps(redact(payload))[:500]}", file=sys.stderr)
          sys.exit(1)
          PY
