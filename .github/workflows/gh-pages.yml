name: Deploy My forest to Pages

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "README.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - "LICENSE"
      - "README.md"
    branches:
      - main

# Allow one concurrent deployment
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record source tree
        id: source
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Find validated PR artifact
        if: ${{ github.event_name == 'push' }}
        id: reuse
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        with:
          script: |
            const artifactName = `pages-${process.env.SOURCE_TREE}`;
            const {data} = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
              per_page: 100,
            });

            for (const artifact of data.artifacts) {
              if (artifact.expired || artifact.name !== artifactName || !artifact.workflow_run) {
                continue;
              }
              if (artifact.workflow_run.head_repository_id !== context.payload.repository.id) {
                continue;
              }

              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: artifact.workflow_run.id,
              });
              if (run.name !== context.workflow || run.event !== 'pull_request' ||
                  run.status !== 'completed' || run.conclusion !== 'success') {
                continue;
              }

              core.info(`Reusing ${artifactName} from successful PR run ${run.id}`);
              core.setOutput('found', 'true');
              core.setOutput('artifact-id', String(artifact.id));
              core.setOutput('run-id', String(run.id));
              return;
            }

            core.info(`No successful PR artifact records source tree ${process.env.SOURCE_TREE}`);
            core.setOutput('found', 'false');
      - name: Download validated PR artifact
        if: ${{ github.event_name == 'push' && steps.reuse.outputs.found == 'true' }}
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.reuse.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.reuse.outputs.run-id }}
          path: ${{ runner.temp }}/validated-pages
      - name: Restore validated PR artifact
        if: ${{ github.event_name == 'push' && steps.download.outcome == 'success' }}
        id: restore
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/restored-pages"
          tar -xf "$RUNNER_TEMP/validated-pages/artifact.tar" -C "$RUNNER_TEMP/restored-pages"
          test -s "$RUNNER_TEMP/restored-pages/index.html"
          mkdir -p output
          mv "$RUNNER_TEMP/restored-pages" output/forest
      - uses: extractions/setup-just@v1
        if: ${{ steps.restore.outcome != 'success' }}
        with:
          just-version: 1.40.0
      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.restore.outcome != 'success' }}
        with:
          bun-version: 1.2.22
      # The lint step runs the stdlib-only FTIP prose checker through uv.
      - name: Setup Python via uv
        if: ${{ steps.restore.outcome != 'success' }}
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.27"
      - name: Setup Biome
        if: ${{ steps.restore.outcome != 'success' }}
        uses: biomejs/setup-biome@v2
        with:
            version: latest
      - name: Lint
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          ./chk.sh
      - name: Setup TeX Live
        if: ${{ steps.restore.outcome != 'success' }}
        uses: utensil/setup-texlive-action@v4
        with:
          packages: scheme-full
          # Pin to 2025: TeX Live 2026 (released 2026-05) breaks the action for a
          # few days post-release ("may not work properly"). Bump/remove once 2026 settles.
          version: 2025
      - name: Check `latex`
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          echo $GITHUB_PATH
          tlmgr --version
          which latex
      - name: Cache WASM packages
        if: ${{ steps.restore.outcome != 'success' }}
        uses: actions/cache@v4
        with:
          path: |
            lib/**/pkg
          key: ${{ runner.os }}-wasm-${{ hashFiles('build.sh', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Setup Pages
        if: ${{ !env.ACT }}
        id: pages
        uses: actions/configure-pages@v5
      - name: Set-up OCaml
        if: ${{ steps.restore.outcome != 'success' }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"
          # dune-cache: true
      # - name: Cache opam packages
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.opam
      #     key: ${{ runner.os }}-opam-${{ hashFiles('**/*.opam') }}
      #     restore-keys: |
      #       ${{ runner.os }}-opam-
      - name: Install forester
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          sudo apt install libev-dev
          sudo apt update
          sudo apt install libev-dev
          opam pin add forester git+https://github.com/utensil/ocaml-forester.git#2ed9c1cab0112921eb3497cb1a5a0e2fbaa1f8cd --yes
          opam install forester --yes
      - name: Install xsltproc and PDF text tools
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          sudo apt install xsltproc poppler-utils
      # - name: Install Homebrew
      #   run: |
      #     bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      #     eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
      #     echo "$(brew --prefix)/bin" >> $GITHUB_PATH
      # - name: Install saxon
      #   run: |
      #     brew install saxon
      - name: Build with forester
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          eval $(opam env)
          export TERM=xterm-256color
          forester --version
          bash ./build.sh
      - name: Verify Forester output contract
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          just verify-pdf-fixtures
      # - name: Check for PDF files
      #   run: |
      #     pdf_count=$(find ./output -name "*.pdf" | wc -l)
      #     if [ "$pdf_count" -eq 0 ]; then
      #       echo "Error: No PDF files found in the output directory."
      #       exit 1
      #     fi
      #     echo "Found $pdf_count PDF files."
      - name: Fix permissions
        run: |
          chmod -c -R +rX "./output/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done
      - name: Upload validated PR artifact
        if: ${{ !env.ACT && github.event_name == 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ steps.source.outputs.tree }}
          path: ./output/forest
      - name: Upload Pages artifact
        if: ${{ !env.ACT && github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output/forest

  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
